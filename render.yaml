databases:
  - name: lab2-db
    plan: free
    databaseName: lab2
    user: lab2
services:
  - type: web
    name: rails-microblog
    runtime: ruby
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lab2-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: 'true'
